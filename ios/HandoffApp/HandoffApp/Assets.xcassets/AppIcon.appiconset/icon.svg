<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4096ff"/>
      <stop offset="100%" stop-color="#1668dc"/>
    </linearGradient>
  </defs>

  <!-- Full square background -->
  <rect width="512" height="512" rx="0" ry="0" fill="url(#bg)"/>

  <!-- Central logo: connected dots with FRP tunnel lines -->
  <!-- Left dot (Windows) -->
  <circle cx="160" cy="256" r="48" fill="url(#accent)" opacity="0.95"/>
  <rect x="144" y="248" width="32" height="16" rx="4" fill="#fff" opacity="0.9"/>
  <rect x="144" y="272" width="32" height="8" rx="4" fill="#fff" opacity="0.5"/>

  <!-- Right dot (iOS) -->
  <circle cx="352" cy="256" r="48" fill="url(#accent)" opacity="0.95"/>
  <rect x="336" y="240" width="32" height="6" rx="3" fill="#fff" opacity="0.6"/>
  <rect x="336" y="252" width="32" height="6" rx="3" fill="#fff" opacity="0.9"/>
  <rect x="336" y="264" width="24" height="6" rx="3" fill="#fff" opacity="0.6"/>

  <!-- Connecting tunnel line -->
  <line x1="208" y1="256" x2="304" y2="256" stroke="url(#accent)" stroke-width="4" stroke-dasharray="8,6" opacity="0.7"/>

  <!-- Data dots on the tunnel -->
  <circle cx="240" cy="250" r="5" fill="#52c41a" opacity="0.8"/>
  <circle cx="272" cy="262" r="4" fill="#52c41a" opacity="0.6"/>

  <!-- Top header text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#fff" opacity="0.9">HANDOFF</text>
  <text x="256" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#8c9aab" opacity="0.7">Device Relay</text>
</svg>
