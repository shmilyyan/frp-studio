name: HandoffApp
options:
  bundleIdPrefix: com.frper
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0

targets:
  HandoffApp:
    type: application
    platform: iOS
    entitlements:
      keychain-access-groups:
        - $(AppIdentifierPrefix)group.com.frp-studio.handoff
    sources:
      - path: HandoffApp
        excludes:
          - Assets.xcassets
      - path: HandoffApp/Assets.xcassets
        type: group
    settings:
      base:
        INFOPLIST_FILE: HandoffApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.frper.handoff
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: SocketIO

  ShareExtension:
    type: app-extension
    platform: iOS
    entitlements:
      keychain-access-groups:
        - $(AppIdentifierPrefix)group.com.frp-studio.handoff
    sources:
      - ShareExtension
      - path: HandoffApp/Services/KeychainHelper.swift
    settings:
      base:
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.frper.handoff.extension
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.0"
    dependencies: []
