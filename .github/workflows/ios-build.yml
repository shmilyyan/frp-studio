name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios/HandoffApp
          xcodegen generate

      - name: Build iOS App
        run: |
          cd ios/HandoffApp
          xcodebuild -project HandoffApp.xcodeproj \
            -scheme HandoffApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/HandoffApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd ios/HandoffApp
          mkdir -p build/Payload
          cp -R build/HandoffApp.xcarchive/Products/Applications/HandoffApp.app build/Payload/
          cd build
          zip -r HandoffApp.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandoffApp.ipa
          path: ios/HandoffApp/build/HandoffApp.ipa
        continue-on-error: true

      - name: Create Release and upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "iOS HandoffApp (Latest Build)"
          body: "Latest unsigned IPA build of HandoffApp for iOS.\n\nBuild date: ${{ github.event.repository.updated_at }}"
          draft: false
          prerelease: true
          files: ios/HandoffApp/build/HandoffApp.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
