name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          MARKETING_VERSION="1.0"
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          FULL_VERSION="${MARKETING_VERSION}.${BUILD_NUMBER}"
          echo "marketing_version=${MARKETING_VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "short_hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "Version: ${FULL_VERSION} (${SHORT_HASH})"

      - name: Install tools
        run: brew install xcodegen librsvg

      - name: Generate app icon from SVG
        run: |
          ICONSET=ios/HandoffApp/HandoffApp/Assets.xcassets/AppIcon.appiconset
          rsvg-convert -w 1024 -h 1024 "$ICONSET/icon.svg" -o "$ICONSET/icon.png"

      - name: Generate Xcode project
        run: |
          cd ios/HandoffApp
          xcodegen generate

      - name: Build iOS App
        run: |
          cd ios/HandoffApp
          xcodebuild -project HandoffApp.xcodeproj \
            -scheme HandoffApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/HandoffApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build_number }} \
            MARKETING_VERSION=${{ steps.version.outputs.marketing_version }}

      - name: Package IPA
        run: |
          cd ios/HandoffApp
          mkdir -p build/Payload
          cp -R build/HandoffApp.xcarchive/Products/Applications/HandoffApp.app build/Payload/
          cd build
          zip -r HandoffApp.ipa Payload
          rm -rf Payload
          ls -lh HandoffApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandoffApp-${{ steps.version.outputs.full_version }}
          path: ios/HandoffApp/build/HandoffApp.ipa
        continue-on-error: true

      - name: Create Release and upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ steps.version.outputs.full_version }}
          name: "iOS HandoffApp v${{ steps.version.outputs.full_version }}"
          body: |
            ## iOS HandoffApp

            **版本:** ${{ steps.version.outputs.marketing_version }} (Build ${{ steps.version.outputs.build_number }})
            **提交:** ${{ steps.version.outputs.short_hash }}
            **构建时间:** ${{ github.event.repository.updated_at }}

            未签名的 IPA，使用全能签或其他工具签名后安装。
          draft: false
          prerelease: true
          files: ios/HandoffApp/build/HandoffApp.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
